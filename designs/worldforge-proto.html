<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>WorldForge · 设计稿原型预览</title>
<style>
  :root {
    --bg:#F7F9FC; --fg:#0F1729; --panel:#FFFFFF; --border:#E1E7EF;
    --muted:#F1F5F9; --mutedFg:#65758B; --primary:#7C3BED; --accent:#EAF0F6;
    --ok:#10B981; --hint:#A8B3C2;
    --font: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:var(--font); }
  #app { display:flex; height:100vh; overflow:hidden; }

  /* 左侧导航 */
  #nav { width:248px; flex:0 0 248px; background:var(--panel); border-right:1px solid var(--border);
         display:flex; flex-direction:column; overflow:hidden; }
  #nav .brand { padding:14px 16px 10px; border-bottom:1px solid var(--border); }
  #nav .brand b { font-size:15px; font-weight:600; letter-spacing:.2px; }
  #nav .brand span { display:block; margin-top:2px; font-size:11px; color:var(--mutedFg); }
  #nav .list { flex:1; overflow-y:auto; padding:8px; }
  #nav .item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer;
               font-size:13px; color:var(--fg); border:1px solid transparent; }
  #nav .item:hover { background:var(--accent); }
  #nav .item.active { background:#7C3BED26; color:var(--primary); border-color:#7C3BED40; font-weight:500; }
  #nav .item .idx { width:26px; font-size:10px; color:var(--mutedFg); font-variant-numeric:tabular-nums; }
  #nav .item.active .idx { color:var(--primary); }
  #nav .foot { padding:10px 14px; border-top:1px solid var(--border); font-size:10px; color:var(--hint); line-height:1.6; }

  /* 右侧舞台 */
  #stage { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #bar { height:52px; flex:0 0 52px; background:var(--panel); border-bottom:1px solid var(--border);
         display:flex; align-items:center; gap:12px; padding:0 16px; }
  #bar h1 { margin:0; font-size:14px; font-weight:600; }
  #bar .size { font-size:10px; color:var(--mutedFg); font-variant-numeric:tabular-nums; }
  #bar .spacer { flex:1; }
  #bar .ctl { display:flex; align-items:center; gap:6px; }
  #bar button { font-family:var(--font); font-size:12px; height:28px; padding:0 10px; border-radius:8px;
                border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; }
  #bar button:hover { background:var(--accent); }
  #bar button.on { background:var(--primary); border-color:var(--primary); color:#F8FAFC; }
  #bar .zoom { font-size:11px; color:var(--mutedFg); min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }

  #scroll { flex:1; overflow:auto; padding:20px; }
  #fit { display:flex; justify-content:center; align-items:flex-start; min-height:100%; }
  #boardWrap { position:relative; background:#fff; border:1px solid var(--border); border-radius:10px;
               box-shadow:0 8px 24px -8px rgba(15,23,41,.18); overflow:hidden; }
  #boardImg { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  #hotspots { position:absolute; inset:0; }
  .hot { position:absolute; cursor:pointer; border-radius:6px; border:1px solid transparent;
         background:transparent; transition:background .12s, box-shadow .12s, border-color .12s; }
  .hot.show { border-color:#7C3BED66; background:#7C3BED14; }
  .hot.hot-hover { border-color:#7C3BED99; background:#7C3BED26; box-shadow:0 0 0 2px #7C3BED33; }

  /* 底部信息条 */
  #info { flex:0 0 auto; background:var(--panel); border-top:1px solid var(--border); padding:10px 16px;
          display:flex; gap:18px; align-items:flex-start; font-size:11px; color:var(--mutedFg); line-height:1.6; }
  #info .col { max-width:640px; }
  #info b { color:var(--fg); font-weight:600; }
  #info ul { margin:4px 0 0; padding-left:16px; }
  #info li { margin:1px 0; }
  #toast { position:fixed; left:50%; bottom:76px; transform:translateX(-50%) translateY(8px);
           background:#0F1729; color:#fff; font-size:12px; padding:7px 12px; border-radius:8px;
           opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:50; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="brand">
      <b>WorldForge 设计稿</b>
      <span>13 个画板 · 亮色主题 · 1440×900 / 768×900</span>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">按 DESIGN_SKILL.md 生成<br/>点击画面上的高亮框可试交互</div>
  </nav>

  <div id="stage">
    <div id="bar">
      <h1 id="title">—</h1>
      <span class="size" id="size"></span>
      <span class="spacer"></span>
      <div class="ctl">
        <button id="hotToggle" title="显示可交互区域">显示热区</button>
        <button id="zoomOut">−</button>
        <span class="zoom" id="zoom">100%</span>
        <button id="zoomIn">+</button>
        <button id="zoomFit" class="on">适配</button>
        <button id="zoom100">1:1</button>
      </div>
    </div>
    <div id="scroll">
      <div id="fit">
        <div id="boardWrap">
          <img id="boardImg" alt="画板" />
          <div id="hotspots"></div>
        </div>
      </div>
    </div>
    <div id="info">
      <div class="col"><b>这一页在做什么</b><div id="desc"></div></div>
      <div class="col"><b>可试的交互</b><ul id="acts"></ul></div>
    </div>
  </div>
</div>
<div id="toast"></div>

const $ = (s) => document.querySelector(s);
let cur = 0, zoom = 1, fitMode = true, showHot = false;

function renderNav() {
  const list = $('#list');
  list.innerHTML = '';
  BOARDS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'item' + (i === cur ? ' active' : '');
    el.innerHTML = '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span><span>' + b.name + '</span>';
    el.onclick = () => { cur = i; fitMode = true; renderNav(); renderBoard(); };
    list.appendChild(el);
  });
}

function applyZoom() {
  const b = BOARDS[cur];
  const wrap = $('#boardWrap');
  wrap.style.width = (b.w * zoom) + 'px';
  wrap.style.height = (b.h * zoom) + 'px';
  $('#zoom').textContent = Math.round(zoom * 100) + '%';
}

function renderHotspots() {
  const b = BOARDS[cur], box = $('#hotspots');
  box.innerHTML = '';
  b.hots.forEach((h) => {
    const el = document.createElement('div');
    el.className = 'hot' + (showHot ? ' show' : '');
    el.style.left = (h.x * zoom) + 'px';
    el.style.top = (h.y * zoom) + 'px';
    el.style.width = (h.w * zoom) + 'px';
    el.style.height = (h.h * zoom) + 'px';
    el.title = h.title || '';
    if (showHot) {
      el.addEventListener('mouseenter', () => el.classList.add('hot-hover'));
      el.addEventListener('mouseleave', () => el.classList.remove('hot-hover'));
    }
    el.addEventListener('click', (ev) => { ev.stopPropagation(); onHot(h, el); });
    box.appendChild(el);
  });
}

function onHot(h, el) {
  if (h.type === 'goto') {
    const i = BOARDS.findIndex((b) => b.id === h.board);
    if (i >= 0) { cur = i; fitMode = true; renderNav(); renderBoard(); return toast('切换到：' + (h.title || BOARDS[i].name)); }
    return toast(h.title || '');
  }
  if (h.type === 'toast') return toast(h.msg || h.title || '');
  if (h.type === 'select') {
    document.querySelectorAll('.hot.sel').forEach((n) => { n.classList.remove('sel'); n.style.background = ''; n.style.borderColor = ''; });
    el.classList.add('sel');
    el.style.background = '#7C3BED33';
    el.style.borderColor = '#7C3BED';
    return toast(h.title || '已选中');
  }
  if (h.type === 'tabs') {
    const group = BOARDS[cur].hots.filter((x) => x.type === 'tabs');
    document.querySelectorAll('.hot.tabsel').forEach((n) => { n.classList.remove('tabsel'); n.style.background = ''; n.style.borderColor = ''; });
    el.classList.add('tabsel');
    el.style.background = '#7C3BED33';
    el.style.borderColor = '#7C3BED';
    return toast('切换到：' + (h.title || ''));
  }
  if (h.type === 'tool') {
    const group = BOARDS[cur].hots.filter((x) => x.type === 'tool' && x.y === h.y);
    document.querySelectorAll('.hot.toolsel').forEach((n) => { n.classList.remove('toolsel'); n.style.background = ''; n.style.borderColor = ''; });
    el.classList.add('toolsel');
    el.style.background = '#7C3BED33';
    el.style.borderColor = '#7C3BED';
    return toast('当前工具 / 模式：' + (h.title || ''));
  }
  if (h.type === 'toggle') return toast('切换面板显隐：' + (h.target || ''));
  if (h.type === 'collapse') {
    const wrap = el.parentElement;
    el.classList.toggle('open');
    return toast((el.classList.contains('open') ? '展开：' : '折叠：') + (h.title || ''));
  }
  if (h.type === 'search') {
    const q = window.prompt('过滤卡片：输入关键词（标题 / 摘要 / 正文）', '');
    const tiles = BOARDS[cur].hots.filter((x) => x.type === 'select');
    if (q === null) return;
    const box = $('#hotspots');
    tiles.forEach((t, i) => {
      const node = box.querySelectorAll('.hot')[BOARDS[cur].hots.indexOf(t)];
      const hit = !q || ['潮线守望者', '沉钟港', '大退潮', '盐商行会', '回声螺', '潮汐律'][i].indexOf(q) >= 0;
      if (node) node.style.opacity = hit ? '1' : '0.25';
    });
    return toast(q ? ('过滤：' + q) : '清空过滤');
  }
  if (h.type === 'theme') return toast('主题：' + (h.title || ''));
  if (h.type === 'close') {
    const box = $('#hotspots');
    BOARDS[cur].hots.forEach((x, i) => {
      if (x.type === 'close' && x.target === h.target) { }
    });
    toast('关闭浮层：' + (h.target || ''));
  }
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function renderBoard() {
  const b = BOARDS[cur];
  $('#title').textContent = b.name;
  $('#size').textContent = b.w + ' × ' + b.h;
  $('#desc').textContent = b.desc;
  const ul = $('#acts'); ul.innerHTML = '';
  b.acts.forEach((a) => { const li = document.createElement('li'); li.textContent = a; ul.appendChild(li); });
  const img = $('#boardImg');
  img.onload = () => { if (fitMode) fitZoom(); renderHotspots(); };
  img.onerror = () => {
    document.title = 'IMG-FAIL: ' + b.file;
    const w = document.createElement('div');
    w.style.cssText = 'position:fixed;inset:0;background:#DC2828;color:#fff;font:16px/1.6 sans-serif;padding:40px;z-index:99';
    w.textContent = '图片未加载：' + b.file;
    document.body.appendChild(w);
  };
  img.src = b.file;
  img.alt = b.name;
  applyZoom();
  renderHotspots();
  $('#scroll').scrollTop = 0;
  $('#scroll').scrollLeft = 0;
}

function fitZoom() {
  const b = BOARDS[cur];
  const pad = 40;
  const availW = $('#scroll').clientWidth - pad;
  const availH = $('#scroll').clientHeight - pad;
  zoom = Math.min(availW / b.w, availH / b.h);
  zoom = Math.max(0.1, Math.min(zoom, 1));
  applyZoom(); renderHotspots();
}

$('#hotToggle').onclick = (e) => {
  showHot = !showHot;
  e.currentTarget.classList.toggle('on', showHot);
  renderHotspots();
  toast(showHot ? '已显示可交互区域（紫色框）' : '已隐藏可交互区域');
};
$('#zoomIn').onclick = () => { fitMode = false; $('#zoomFit').classList.remove('on'); zoom = Math.min(3, zoom + 0.1); applyZoom(); renderHotspots(); };
$('#zoomOut').onclick = () => { fitMode = false; $('#zoomFit').classList.remove('on'); zoom = Math.max(0.1, zoom - 0.1); applyZoom(); renderHotspots(); };
$('#zoom100').onclick = () => { fitMode = false; $('#zoomFit').classList.remove('on'); zoom = 1; applyZoom(); renderHotspots(); };
$('#zoomFit').onclick = (e) => { fitMode = true; e.currentTarget.classList.add('on'); fitZoom(); };
window.addEventListener('resize', () => { if (fitMode) fitZoom(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { cur = Math.min(BOARDS.length - 1, cur + 1); fitMode = true; renderNav(); renderBoard(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { cur = Math.max(0, cur - 1); fitMode = true; renderNav(); renderBoard(); }
});

renderNav();
renderBoard();
</script>
