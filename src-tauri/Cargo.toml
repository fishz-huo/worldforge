[package]
name = "worldforge"
version = "0.1.0"
description = "WorldForge 世界观工坊 —— 本地优先的世界观构建软件"
authors = ["WorldForge"]
edition = "2021"
# Tauri 2 要求的最低 Rust 版本
rust-version = "1.77.2"

[lib]
# Tauri 2 约定：移动端（Android / iOS）需要 cdylib/staticlib，桌面端用 rlib
name = "worldforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 「另存为」对话框：导出备份时让用户自己选目录与文件名（网页版做不到这一点）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 由 `tauri dev` / `tauri build` 自动注入的自定义协议开关
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 体积优先：世界观软件不需要极限性能，但很在意安装包大小
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
